<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composite Trapezoidal Rule Calculator</title>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process'
            }
        };
    </script>
    
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1, h2, h3 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 8px; }
        .formula-box {
            background-color: #eef2f7;
            padding: 15px;
            border-left: 5px solid #3498db;
            margin: 20px 0;
            font-size: 1.1em;
        }
        .example-box {
            background-color: #fafbfc;
            padding: 15px;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        form {
            background: #fdfefe;
            padding: 20px;
            border: 1px solid #d6dbdf;
            border-radius: 6px;
            margin-top: 20px;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        input[type="text"], input[type="number"] {
            width: 100%; padding: 10px; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 4px; font-size: 1em;
        }
        button {
            background-color: #3498db; color: white; padding: 12px 20px;
            border: none; border-radius: 4px; cursor: pointer; font-size: 1em; width: 100%;
        }
        button:hover { background-color: #2980b9; }
        .result-box {
            background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;
            padding: 15px; border-radius: 4px; margin-top: 20px; font-size: 1.2em; text-align: center;
        }
        .error-box {
            background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;
            padding: 15px; border-radius: 4px; margin-top: 20px;
        }
    </style>
</head>
